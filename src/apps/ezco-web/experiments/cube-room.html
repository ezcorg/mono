<!doctype html>
<!--
  ez co — "the room", hybrid edition (three.js WebGL + CSS3DRenderer).

  The logo's two squares are two faces of a cube. The cube is the building; "ez" is the front door.
  Inside is the collective's room. The furniture is the navigation and the pages render on it:
    laptop on the corner desk   → our work (a little desktop OS; the projects are its programs)
    tablet on the coffee table  → blog (picked up and read)
    kanban on the left wall     → start a project (the "ideas" column is the form)
    gallery wall                → about (employee of the month + a framed manifesto)
    drive + rolodex on the shelf→ GitHub, LinkedIn
    whiteboard on the right wall→ draw on it (kept in localStorage)
    clipboard in your hands     → come work with us (rises when you look down)
    light switch by the door    → day / night; every lamp switches on its own too (state remembered)

  Rendering: WebGL draws the room (geometry, edges, lights, shadows, MSAA). CSS3DRenderer places real DOM
  planes for the content surfaces with the same camera, so forms, links and text stay native. Surfaces are
  laid out at the pixel width they will have on screen when focused; the scene is rendered at ×K so those
  planes sit near scale 1 (crisp rasterisation, 1px borders stay 1px) and far enough apart for Chrome's
  3D sorter. Native scroll containers inside CSS3D planes break that sorting, so surfaces clip and scroll
  by hand.

  Controls: click things · drag or arrows to look · i shows every label · l flips day/night · esc steps back.
  Debug: ?lit · ?look=yaw,pitch · ?hover=<id> · ?labels · ?up · ?win=<app> · ?photo=<url>
-->

<style>
:root{
  --bg:#000; --fg:#F5F5F5; --dim:#333;
  --line:rgba(245,245,245,.6); --line-soft:rgba(245,245,245,.22); --fill:rgba(245,245,245,.07); --bld:#2c2c2c;
  --glow:rgba(255,255,255,.35); --bezel:#2b2b2b;
  --serif:Times,'Times New Roman',serif; --sans:Inter,Helvetica,system-ui,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
}
html.lit{--bg:#F5F5F5; --fg:#000; --dim:#cfcfcf; --line:rgba(0,0,0,.6); --line-soft:rgba(0,0,0,.2); --fill:rgba(0,0,0,.05); --bld:#c9c9c9; --glow:rgba(255,220,120,.6); --bezel:#cfcfcf}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .6s,color .6s}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#gl,#css{position:fixed;inset:0}
#gl{z-index:0;touch-action:none}
#css{z-index:1;pointer-events:none}
body[data-state=room] #gl{cursor:grab}
body.dragging #gl,body.dragging .surface{cursor:grabbing!important}
body.hover #gl{cursor:pointer}
body.preload *{transition:none!important}

/* ---------------------------------------------------------------- 2D chrome */
.labels{position:fixed;inset:0;z-index:2;pointer-events:none}
.lbl{position:absolute;left:0;top:0;translate:-50% -100%;white-space:nowrap;font:500 13px/1 var(--sans);letter-spacing:.06em;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:.55em .85em;opacity:0;transition:opacity .2s,margin .2s;margin-top:.4em}
.lbl::after{content:' →'}
.lbl.action::after{content:''}
.lbl.on{opacity:1;margin-top:0;pointer-events:auto;cursor:pointer}
.lbl.ext::after{content:' ↗'}
.lbl:hover{background:var(--fg);color:var(--bg)}
.prompts{position:fixed;left:0;right:0;bottom:clamp(1rem,3vh,1.75rem);z-index:3;display:flex;justify-content:center;gap:.4rem 1.4rem;flex-wrap:wrap;padding:0 1rem;pointer-events:none;font:400 13px/1 var(--sans);letter-spacing:.03em;color:var(--fg);text-shadow:0 0 10px var(--bg),0 0 3px var(--bg)}
.prompts span{display:inline-flex;align-items:center;gap:.5em;white-space:nowrap}
.prompts kbd{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--fg);background:var(--bg);border:1px solid var(--fg);padding:.35em .5em;border-radius:2px;min-width:1.7em;text-align:center;text-shadow:none}
.prompts .btn{pointer-events:auto;cursor:pointer}
.prompts .btn:hover kbd,.prompts .btn.on kbd{background:var(--fg);color:var(--bg)}
.hero-copy{position:fixed;left:0;right:0;bottom:clamp(4rem,10vh,6rem);z-index:2;display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center;padding:0 1rem;pointer-events:none;transition:opacity .5s,translate .5s}
body:not([data-state=logo]) .hero-copy{opacity:0;translate:0 1rem}
.hero-copy p{margin:0;font:300 clamp(1.15rem,2.4vw,1.75rem)/1.3 var(--serif);letter-spacing:-.01em}
.hero-copy .enter{pointer-events:auto;background:var(--bg);font:400 1rem/1 var(--sans);border:1px solid var(--fg);padding:.9rem 1.6rem;transition:background .3s,color .3s;letter-spacing:.02em}
.hero-copy .enter:hover,.hero-copy .enter:focus-visible{background:var(--fg);color:var(--bg)}
.sr-nav{position:fixed;left:50%;bottom:clamp(3.5rem,8vh,5rem);z-index:4;translate:-50% 0;display:flex;gap:.5rem}
.sr-nav a,.sr-nav button{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sr-nav a:focus-visible,.sr-nav button:focus-visible{position:static;width:auto;height:auto;clip:auto;font:500 13px/1 var(--sans);letter-spacing:.06em;color:var(--bg);background:var(--fg);padding:.6em .9em;outline:0;text-decoration:none}
.loading{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--bg);font:300 1.1rem/1 var(--serif);letter-spacing:.1em;transition:opacity .5s,visibility 0s .5s}
.loading.off{opacity:0;pointer-events:none;visibility:hidden}

/* ---------------------------------------------------------------- content surfaces */
/* the transformed element itself must not clip: overflow:hidden on a 3D-transformed element breaks Chrome's hit-testing, so each content root clips instead */
.surface{font-family:var(--serif);font-size:16px;line-height:1.45;color:var(--fg);background:var(--bg);overflow:visible;transition:background .6s,color .6s,box-shadow .25s;user-select:text;-webkit-user-select:text}
.surface.active{pointer-events:auto}
.surface a{color:inherit}
.surface h2{font:300 1.75em/1.15 var(--serif);letter-spacing:-.02em;margin:0 0 .5em}
.surface h3{font:300 1.3em/1.2 var(--serif);letter-spacing:-.02em;margin:1em 0 .4em}
.surface p{margin:0 0 .7em}
.surface .lede{opacity:.75;margin-bottom:1em}
.surface ul{list-style:none;margin:0;padding:0}
.surface li{position:relative;padding-left:1.1em;margin-bottom:.5em}
.surface li::before{content:'*';position:absolute;left:0;top:0;opacity:.6;font-weight:700}
.surface .link{text-decoration:underline;text-decoration-color:rgba(128,128,128,.7);text-underline-offset:.15em}
.surface .link:hover{text-decoration-color:currentColor}
.scroller{position:absolute;inset:0;overflow:hidden;outline:0}
.scroller:focus-visible{box-shadow:inset 0 0 0 2px var(--line-soft)}
.form{display:flex;flex-direction:column;gap:.6em;font-family:var(--sans);font-size:.92em}
.form label{display:block;font-size:.8em;opacity:.75;margin-bottom:.2em}
.form input,.form select,.form textarea{width:100%;font:inherit;line-height:1.3;color:var(--fg);background:transparent;border:1px solid var(--line-soft);padding:.5em .6em;border-radius:0;-webkit-appearance:none;appearance:none;transition:border-color .2s}
.form select{background-image:linear-gradient(45deg,transparent 50%,var(--fg) 50%),linear-gradient(135deg,var(--fg) 50%,transparent 50%);background-position:calc(100% - .9em) 50%,calc(100% - .55em) 50%;background-size:.35em .35em;background-repeat:no-repeat}
.form select option{background:var(--bg);color:var(--fg)}
.form input:focus,.form select:focus,.form textarea:focus{outline:0;border-color:var(--fg)}
.form textarea{resize:none;min-height:4em}
.form .money{position:relative}
.form .money span{position:absolute;left:.6em;top:50%;translate:0 -50%;opacity:.6}
.form .money input{padding-left:1.5em}
.form .submit{align-self:flex-start;background:var(--fg);color:var(--bg);padding:.6em 1.1em;border:1px solid var(--fg);font:inherit;margin-top:.2em;cursor:pointer}
.form .thanks{display:none;font-family:var(--serif);font-size:1.1em;border:1px solid var(--fg);padding:.8em}
.form.sent>*{display:none}.form.sent .thanks{display:block}
.form input[type=file]{padding:.3em}

@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* laptop screen: a tiny desktop OS */
.scr{background:var(--bg);font-family:var(--mono)}
.scr .doc{position:absolute;inset:6%;overflow:hidden;font:14px/1.55 var(--mono);white-space:nowrap;opacity:.9}
.scr .doc .h{font-weight:700}
.scr .doc .cur{display:inline-block;width:1px;height:1em;background:currentColor;vertical-align:-.15em;animation:blink 1s step-start infinite}
.os{display:none;position:absolute;inset:0;overflow:hidden;font:12.5px/1.4 var(--mono);color:var(--fg);background:var(--bg);background-image:radial-gradient(var(--line-soft) .8px,transparent 1px);background-size:18px 18px}
.scr.active .os{display:block}
.scr.active .doc{display:none}
.os .bar{position:absolute;left:0;right:0;top:0;height:2.2em;display:flex;align-items:center;justify-content:space-between;padding:0 1em;background:var(--bg);border-bottom:1px solid var(--line-soft);font-size:11.5px;letter-spacing:.06em}
.os .bar b{font-weight:700}
.os .desk{position:absolute;left:0;right:0;top:2.2em;bottom:0;padding:3% 2.5%;display:flex;flex-wrap:wrap;align-content:flex-start;gap:.6em 0}
.app{position:relative;width:104px;display:flex;flex-direction:column;align-items:center;gap:.45em;padding:.7em .3em .5em;font:inherit;color:inherit;text-align:center;border-radius:4px}
.app .ico{width:54px;height:54px;display:grid;place-items:center;font-size:26px;line-height:1;border:1px solid var(--line);border-radius:7px;background:var(--bg);transition:background .2s,color .2s}
.app .ico.plus{font:300 38px/1 var(--sans)}
.app .nm{font-size:11.5px;white-space:nowrap}
.app:hover .ico,.app:focus-visible .ico{background:var(--fg);color:var(--bg)}
.app:focus-visible{outline:1px dashed var(--line);outline-offset:-1px}
.app .tip{display:none;position:absolute;top:100%;left:50%;translate:-50% 0;width:224px;margin-top:.2em;text-align:left;background:var(--bg);border:1px solid var(--fg);padding:.6em .75em;z-index:3;font-size:11.5px;line-height:1.45;box-shadow:4px 4px 0 var(--line-soft);pointer-events:none}
.app:first-child .tip{left:0;translate:0}
.app:hover .tip,.app:focus-visible .tip{display:block}
.app .tip b{display:block;font-weight:700;margin-bottom:.15em}
.app .tip small{display:block;opacity:.65;margin-top:.35em}
.win{position:absolute;left:5%;right:5%;top:11%;bottom:5%;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);box-shadow:8px 8px 0 var(--line-soft);z-index:4}
.win[hidden]{display:none}
.win.wide{left:3%;right:3%;top:9%;bottom:3%}
.win .tb{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:.45em .7em;border-bottom:1px solid var(--fg);font-size:11.5px;letter-spacing:.06em}
.win .tb button{font:inherit;line-height:1;padding:.15em .45em;border:1px solid var(--line);cursor:pointer}
.win .tb button:hover,.win .tb button:focus-visible{background:var(--fg);color:var(--bg)}
.win .body{flex:1;min-height:0;position:relative}
.win .body .scroller{padding:1em 1.1em 1.2em}
.win iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.win .form{font-family:var(--mono);font-size:1em}
.win .form input,.win .form select,.win .form textarea{font-family:var(--mono)}
.win .form .thanks{font-family:var(--mono);font-size:1em}

/* tablet reader */
.reader{background:var(--bg);border:7px solid var(--bezel);border-radius:10px;transition:border-color .6s}
.reader .bar{position:absolute;left:0;right:0;top:0;height:2.6em;display:flex;align-items:center;justify-content:space-between;padding:0 6%;font:500 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;opacity:.7;border-bottom:1px solid var(--line-soft)}
.reader .scroller{top:2.6em;padding:5% 6% 8%}
.reader h1{font:300 1.5em/1.15 var(--serif);letter-spacing:-.02em;margin:.2em 0 .3em}
.reader .meta{font:400 .72em/1.2 var(--sans);opacity:.6;margin-bottom:1.1em}
.reader p{margin:0 0 .75em}
.reader h2{font-size:1.25em;margin:.9em 0 .35em}
.reader code{font-family:var(--mono);font-size:.9em;background:var(--fill);padding:0 .3em}
.reader .posts{margin-bottom:1.4em}
.reader .posts a{display:block;text-decoration:none;border:1px solid var(--line-soft);padding:.5em .6em;transition:background .2s,color .2s}
.reader .posts a.on,.reader .posts a:hover{background:var(--fg);color:var(--bg)}
.reader .posts b{display:block;font-weight:400;font-size:1.05em}
.reader .posts small{display:block;font:400 .72em/1.3 var(--sans);opacity:.65;margin-top:.2em}
.reader .idle{position:absolute;inset:0;border-radius:3px;display:grid;place-items:center;font:500 44px/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--fg);text-align:center;background:var(--bg)}
.reader .idle span{display:block;font-size:.5em;opacity:.55}
.reader.active .idle{display:none}
.tags{display:flex;flex-wrap:wrap;gap:.3em;margin-top:.5em}
.tag{font:400 .68em/1 var(--sans);border:1px solid var(--line-soft);border-radius:999px;padding:.3em .6em;opacity:.75}

/* kanban */
.board{background:var(--bg);background-image:radial-gradient(var(--line-soft) 1.2px,transparent 1.5px);background-size:22px 22px;font-family:var(--sans)}
.kb{position:absolute;inset:3%;overflow:hidden;display:grid;grid-template-columns:1.45fr 1fr 1fr;gap:2.5%}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
.col h4{margin:0 0 4px;font:500 12px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;text-align:center;opacity:.7;border-bottom:1px solid var(--line-soft);padding-bottom:8px}
.note{position:relative;background:var(--fill);border:1px solid var(--line);padding:12px 11px 10px;font:400 12.5px/1.3 var(--serif);color:var(--fg);rotate:-1.5deg;box-shadow:2px 3px 0 var(--line-soft);transition:background .25s,color .25s}
.note:nth-child(odd){rotate:1.2deg}
.note::before{content:'';position:absolute;left:50%;top:-5px;width:9px;height:9px;border-radius:50%;background:var(--fg);translate:-50% 0}
.note small{display:block;font:400 .82em/1.2 var(--sans);opacity:.6;margin-top:.3em}
.note.new{rotate:-.6deg;background:var(--bg);border:1.5px solid var(--fg);padding:1em .9em;font:16px/1.45 var(--sans);box-shadow:5px 6px 0 var(--line-soft)}
.note.new::before{background:var(--fg)}
.note.new b{display:block;font:300 1.35em/1.1 var(--serif);margin-bottom:.35em;letter-spacing:-.01em}
.note.new .stuckText{display:none;font:400 15px/1.35 var(--serif)}
.note.new.stuck .form{display:none}
.note.new.stuck .stuckText{display:block}

/* manifesto */
.manifesto{background:var(--bg);box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 5px var(--line-soft)}
.manifesto .scroller{padding:7% 8%}
.manifesto h3:first-child{margin-top:0}
.manifesto .mission{border:1px solid var(--line-soft);padding:.6em .7em;background:var(--fill);transition:background .3s,color .3s,border-color .3s}
.manifesto .mission:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.manifesto .mission:hover .link{color:#0066cc}

/* clipboard sheet */
.sheet{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line-soft)}
.sheet .scroller{padding:9% 8% 6%}
.sheet h2{font-size:1.5em;margin-bottom:.15em}
</style>
</head>

    <h1>Trying to build a company that doesn't ruin the world</h1>
    <div class="meta">28 June 2025 · tbrockman</div>
    <p>If you're someone who has worked in the tech industry (or any industry, really), you've probably borne witness to the many ways in which the products you've built can be harmful.</p>
    <p>Worse still, you've probably seen that harm be <em>intentional</em>, often driven by decisions to prioritize profit over people.</p>
    <p>I'm not going to list <em>all</em> the reasons behind why I think this occurs, but I believe that it's enabled the most by one thing we can change:</p>
    <h2>Corporate hierarchy</h2>
    <p>In the current corporate meta where big company executives and majority share holders rule with little accountability, it's difficult for employees to do much to meaningfully influence an organizations direction beyond resigning (<em>something which is generally regarded as a bad idea in the current job market</em>). Some occasionally triumph and manage to steer the ship, but many others are forced to watch helplessly as their C-suite drown Leonardo DiCaprio in the North Atlantic.</p>
    <p>Network effects, walled-gardens, and lack of competition (due to ineffective and oft unenforced US antitrust law) make it difficult for consumers to vote with their wallets.</p>
    <p>Over-representation of psychopathic traits in leadership roles means that the people who are in charge of making decisions are the least empathetic, and more likely to assign a low cost to suffering of others.</p>
    <p>Conveniently, excessive layers of middle-management provide a way for non-decision makers to absolve themselves of any responsibility they might feel for their involvement, placing the blame at the feet of their masters instead.</p>
    <p>Even with the best of intentions, the pressure to perform, meet targets, or satisfy fiduciary duties can lead to decisions that prioritize local profits over global well-being.</p>
    <p>Maximizing growth above all has led to a pretty large tab for humanity to pay, with the ones who ordered fancy cocktails and multiple entrees conveniently sitting it out in the restroom.</p>
    <h2>The solution</h2>
    <p>Abolish the hierarchy.</p>
    <p>Or, at least, the unnatural kind that exists in most companies today.</p>
    <p>Create flat (<em>or other interestingly-shaped</em>) organizations to add checks and balances on power. Build communities where every member has a voice, and where decisions are made collaboratively rather than top-down. Incentivize participation, punish apathy and exploitation. Make fair rules and update them in response to change.</p>
    <p>Let experts in their fields make decisions they're best equipped to make, and defer to others for those they're not.</p>
    <p>Be transparent. Be accountable.</p>
    <p>Don't be evil.</p>
    <p>Stay tuned,<br>- <code>ez co</code></p>

/* ------------------------------------------------------------------ tweens */
const tweens = [];
function tween(o) { return new Promise(res => { tweens.push({ ...o, t0: performance.now() + (o.delay || 0), dur: reduced ? 1 : o.dur, ease: o.ease || easeInOut, res }); }); }
function runTweens(now) { for (let i = tweens.length - 1; i >= 0; i--) { const t = tweens[i]; if (now < t.t0) continue; const k = clamp((now - t.t0) / t.dur, 0, 1); t.update(t.from + (t.to - t.from) * t.ease(k)); if (k >= 1) { tweens.splice(i, 1); t.res(); } } }

/* ------------------------------------------------------------------ camera */
const cam = { pos: V3(), target: V3() };
let camTween = null;
function poseTo(p, dur) { return new Promise(res => { camTween = { p0: cam.pos.clone(), t0: cam.target.clone(), p1: p.pos.clone(), t1: p.target.clone(), start: performance.now(), dur: reduced ? 1 : dur, res }; }); }
function setPose(p) { camTween = null; cam.pos.copy(p.pos); cam.target.copy(p.target); }
const spherical = (r, az, el, target) => ({ pos: V3(r * Math.cos(el * D2R) * Math.sin(az * D2R), r * Math.sin(el * D2R), r * Math.cos(el * D2R) * Math.cos(az * D2R)).add(target), target: target.clone() });
const POSE = {
  logo: (az = 40, el = 12) => spherical(isPortrait() ? 3.6 : 2.7, az, el, V3(0, -.22, 0)),
  front: () => ({ pos: V3(0, .12, isPortrait() ? 3.4 : 2.7), target: V3(0, -.05, 0) }),
  room: () => ({ pos: V3(0, .05, isPortrait() ? 1.45 : 1.22), target: V3(0, -.1, 0) }),
};
function fitPose(spec) {
  const W = innerWidth, H = innerHeight, aspect = W / H, tanV = Math.tan(camera.fov * D2R / 2), fit = .86;
  const wantPx = Math.min(W * fit, spec.max || 1e9);
  const d = Math.max(spec.w * W / (2 * tanV * aspect * wantPx), spec.h / (2 * tanV * fit));
  const px = spec.w * W / (2 * d * tanV * aspect);
