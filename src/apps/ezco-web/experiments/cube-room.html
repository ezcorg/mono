<!doctype html>
<!--
  ez co — "the room", hybrid edition (three.js WebGL + CSS3DRenderer).

  The logo's two squares are two faces of a cube. The cube is the building; "ez" is the front door.
  Inside is the collective's room. The furniture is the navigation and the pages render on it:
    laptop on the corner desk   → our work
    tablet on the coffee table  → blog (picked up and read)
    kanban on the left wall     → start a project (the "ideas" column is the form)
    gallery wall                → about (portraits + a framed manifesto)
    bookshelf                   → connect (the book spines are the links)
    clipboard on the left wall  → come work with us (a sign-up sheet)
    arc floor lamp              → day / night

  Rendering: WebGL draws the room (geometry, edges, lights, shadows, MSAA). CSS3DRenderer places real DOM
  planes for the content surfaces with the same camera, so forms, links and text stay native. Surfaces are
  laid out at the pixel width they will have on screen when focused; the scene is rendered at ×K so those
  planes sit near scale 1 (crisp rasterisation, 1px borders stay 1px) and far enough apart for Chrome's
  3D sorter. Native scroll containers inside CSS3D planes break that sorting, so surfaces clip and scroll
  by hand.

  Controls: click things · drag or arrows to look · i shows every label · l flips day/night · esc steps back.
  Debug: ?lit · ?look=yaw,pitch · ?hover=<id> · ?labels
-->

/* ---------------------------------------------------------------- 2D chrome */
.labels{position:fixed;inset:0;z-index:2;pointer-events:none}
.lbl{position:absolute;left:0;top:0;translate:-50% -100%;white-space:nowrap;font:500 13px/1 var(--sans);letter-spacing:.06em;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:.55em .85em;opacity:0;transition:opacity .2s,margin .2s;margin-top:.4em}
.lbl::after{content:' →'}
.lbl.action::after{content:''}
.lbl.on{opacity:1;margin-top:0}
.prompts{position:fixed;left:0;right:0;bottom:clamp(1rem,3vh,1.75rem);z-index:3;display:flex;justify-content:center;gap:.4rem 1.4rem;flex-wrap:wrap;padding:0 1rem;pointer-events:none;font:400 13px/1 var(--sans);letter-spacing:.03em;color:var(--fg);text-shadow:0 0 10px var(--bg),0 0 3px var(--bg)}
.prompts span{display:inline-flex;align-items:center;gap:.5em;white-space:nowrap}
.prompts kbd{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--fg);background:var(--bg);border:1px solid var(--fg);padding:.35em .5em;border-radius:2px;min-width:1.7em;text-align:center;text-shadow:none}
.prompts .btn{pointer-events:auto;cursor:pointer}
.prompts .btn:hover kbd,.prompts .btn.on kbd{background:var(--fg);color:var(--bg)}
.hero-copy{position:fixed;left:0;right:0;bottom:clamp(4rem,10vh,6rem);z-index:2;display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center;padding:0 1rem;pointer-events:none;transition:opacity .5s,translate .5s}
body:not([data-state=logo]) .hero-copy{opacity:0;translate:0 1rem}
.hero-copy p{margin:0;font:300 clamp(1.15rem,2.4vw,1.75rem)/1.3 var(--serif);letter-spacing:-.01em}
.hero-copy .enter{pointer-events:auto;font:400 1rem/1 var(--sans);border:1px solid var(--fg);padding:.9rem 1.6rem;transition:background .3s,color .3s;letter-spacing:.02em}
.hero-copy .enter:hover,.hero-copy .enter:focus-visible{background:var(--fg);color:var(--bg)}
.sr-nav{position:fixed;left:50%;bottom:clamp(3.5rem,8vh,5rem);z-index:4;translate:-50% 0;display:flex;gap:.5rem}
.sr-nav a,.sr-nav button{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sr-nav a:focus-visible,.sr-nav button:focus-visible{position:static;width:auto;height:auto;clip:auto;font:500 13px/1 var(--sans);letter-spacing:.06em;color:var(--bg);background:var(--fg);padding:.6em .9em;outline:0;text-decoration:none}
.loading{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--bg);font:300 1.1rem/1 var(--serif);letter-spacing:.1em;transition:opacity .5s,visibility 0s .5s}
.loading.off{opacity:0;pointer-events:none;visibility:hidden}

/* ---------------------------------------------------------------- content surfaces */
.surface{font-family:var(--serif);font-size:16px;line-height:1.45;color:var(--fg);background:var(--bg);overflow:hidden;transition:background .6s,color .6s,box-shadow .25s;user-select:text;-webkit-user-select:text}
.surface.hot{box-shadow:0 0 40px var(--glow)}
.surface a{color:inherit}
.surface h2{font:300 1.75em/1.15 var(--serif);letter-spacing:-.02em;margin:0 0 .5em}
.surface h3{font:300 1.3em/1.2 var(--serif);letter-spacing:-.02em;margin:1em 0 .4em}
.surface p{margin:0 0 .7em}
.surface .lede{opacity:.75;margin-bottom:1em}
.surface ul{list-style:none;margin:0;padding:0}
.surface li{position:relative;padding-left:1.1em;margin-bottom:.5em}
.surface li::before{content:'*';position:absolute;left:0;top:0;opacity:.6;font-weight:700}
.surface .link{text-decoration:underline;text-decoration-color:rgba(128,128,128,.7);text-underline-offset:.15em}

.form input,.form select,.form textarea{width:100%;font:inherit;line-height:1.3;color:var(--fg);background:transparent;border:1px solid var(--line-soft);padding:.5em .6em;border-radius:0;-webkit-appearance:none;appearance:none;transition:border-color .2s}
.form select{background-image:linear-gradient(45deg,transparent 50%,var(--fg) 50%),linear-gradient(135deg,var(--fg) 50%,transparent 50%);background-position:calc(100% - .9em) 50%,calc(100% - .55em) 50%;background-size:.35em .35em;background-repeat:no-repeat}
.form select option{background:var(--bg);color:var(--fg)}
.form input:focus,.form select:focus,.form textarea:focus{outline:0;border-color:var(--fg)}
.form textarea{resize:none;min-height:4em}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
.form .money{position:relative}
.form .money span{position:absolute;left:.6em;top:50%;translate:0 -50%;opacity:.6}
.form .money input{padding-left:1.5em}
.form .submit{align-self:flex-start;background:var(--fg);color:var(--bg);padding:.6em 1.1em;border:1px solid var(--fg);font:inherit;margin-top:.2em;cursor:pointer}
.form .thanks{display:none;font-family:var(--serif);font-size:1.1em;border:1px solid var(--fg);padding:.8em}
.form.sent>*{display:none}.form.sent .thanks{display:block}
.form input[type=file]{padding:.3em}

/* TV: logo + hero + ticker */
.tvs{background:var(--bg);font-family:var(--serif)}
.tvs .logo{position:absolute;left:5%;top:9%;--ls:64px;display:flex}
.tvs .logo .lw{position:relative;width:calc(var(--ls)*2);height:var(--ls);overflow:hidden;isolation:isolate;background:var(--bg)}
.tvs .logo .lw::before,.tvs .logo .lw::after{content:'';position:absolute;top:0;width:var(--ls);height:var(--ls);border:2px solid var(--fg);z-index:3}
.tvs .logo .lw::before{left:0}.tvs .logo .lw::after{left:var(--ls)}
.tvs .logo .lt{position:absolute;inset:0;display:flex;font:500 calc(var(--ls)*.4)/1 var(--sans);color:#fff;mix-blend-mode:difference;z-index:2}
.tvs .logo .lt span{width:var(--ls);height:var(--ls);display:grid;place-items:center}
.tvs .logo .ls{position:absolute;top:0;left:var(--ls);width:var(--ls);height:var(--ls);background:var(--fg);z-index:1;animation:logoslide 9s ease-in-out infinite}

.tvs .hero{position:absolute;left:5%;right:5%;top:34%}

/* manifesto */
.manifesto{background:var(--bg);box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 5px var(--line-soft)}

/* bookshelf */

</style>
</head>

    <div class="posts"><a class="on" href="#/blog/starting-a-tech-company-that-doesnt-ruin-the-world"><b>Trying to build a company that doesn't ruin the world</b><small>28 June 2025 · tbrockman</small></a></div>
    <h1>Trying to build a company that doesn't ruin the world</h1>
    <div class="meta">28 June 2025 · tbrockman</div>
    <p>If you're someone who has worked in the tech industry (or any industry, really), you've probably borne witness to the many ways in which the products you've built can be harmful.</p>
    <p>Worse still, you've probably seen that harm be <em>intentional</em>, often driven by decisions to prioritize profit over people.</p>
    <p>I'm not going to list <em>all</em> the reasons behind why I think this occurs, but I believe that it's enabled the most by one thing we can change:</p>
    <h2>Corporate hierarchy</h2>
    <p>In the current corporate meta where big company executives and majority share holders rule with little accountability, it's difficult for employees to do much to meaningfully influence an organizations direction beyond resigning (<em>something which is generally regarded as a bad idea in the current job market</em>). Some occasionally triumph and manage to steer the ship, but many others are forced to watch helplessly as their C-suite drown Leonardo DiCaprio in the North Atlantic.</p>
    <p>Network effects, walled-gardens, and lack of competition (due to ineffective and oft unenforced US antitrust law) make it difficult for consumers to vote with their wallets.</p>
    <p>Over-representation of psychopathic traits in leadership roles means that the people who are in charge of making decisions are the least empathetic, and more likely to assign a low cost to suffering of others.</p>
    <p>Conveniently, excessive layers of middle-management provide a way for non-decision makers to absolve themselves of any responsibility they might feel for their involvement, placing the blame at the feet of their masters instead.</p>
    <p>Even with the best of intentions, the pressure to perform, meet targets, or satisfy fiduciary duties can lead to decisions that prioritize local profits over global well-being.</p>
    <p>Maximizing growth above all has led to a pretty large tab for humanity to pay, with the ones who ordered fancy cocktails and multiple entrees conveniently sitting it out in the restroom.</p>
    <h2>The solution</h2>
    <p>Abolish the hierarchy.</p>
    <p>Or, at least, the unnatural kind that exists in most companies today.</p>
    <p>Create flat (<em>or other interestingly-shaped</em>) organizations to add checks and balances on power. Build communities where every member has a voice, and where decisions are made collaboratively rather than top-down. Incentivize participation, punish apathy and exploitation. Make fair rules and update them in response to change.</p>
    <p>Let experts in their fields make decisions they're best equipped to make, and defer to others for those they're not.</p>
    <p>Be transparent. Be accountable.</p>
    <p>Don't be evil.</p>
    <p>Stay tuned,<br>- <code>ez co</code></p>
    <div class="tags"><span class="tag">ez co</span><span class="tag">hello-world</span><span class="tag">introduction</span><span class="tag">tech</span></div>
  </div>
