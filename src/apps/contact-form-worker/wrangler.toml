name = "contact-form-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

[env.production]
name = "contact-form-worker"

[vars]
ENVIRONMENT = "production"

# Rate limiting: attempts per IP per minute, counted only once a request has passed validation and the captcha.
# The binding can't refund a token, so the budget leaves room to retry after a failed send (src/index.ts).
[[unsafe.bindings]]
name = "IP_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# Add your secrets:
# wrangler secret put EMAIL_USERNAME
# wrangler secret put EMAIL_PASSWORD
# wrangler secret put TURNSTILE_SECRET_KEY
# wrangler secret put RECIPIENT_EMAIL (optional)