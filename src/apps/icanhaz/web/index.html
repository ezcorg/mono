<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>icanhaz · terminal</title>
    <style>
      :root { color-scheme: dark; }
      body { font: 14px/1.4 -apple-system, system-ui, sans-serif; margin: 0; background: #1e1e1e; color: #ddd; }
      header { display: flex; gap: 8px; align-items: center; padding: 10px 12px; background: #2a2a2f; border-bottom: 1px solid #000; }
      header input { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid #444; background: #1e1e1e; color: #ddd; }
      #url { width: min(360px, 50vw); }
      #pin { width: 90px; }
      button { font: inherit; padding: 5px 12px; border-radius: 6px; border: none; background: #2490e9; color: #fff; cursor: pointer; }
      #status { margin-left: auto; color: #99a; font-size: 13px; }
      #term { height: calc(100vh - 53px); padding: 6px 8px; }
    </style>
  </head>
  <body>
    <header>
      <input id="url" value="ws://127.0.0.1:7777" placeholder="ws(s)://mac.&lt;tailnet&gt;.ts.net/" />
      <input id="pin" placeholder="PIN" autocomplete="off" />
      <button id="connect">Connect</button>
      <span id="status">idle</span>
    </header>
    <div id="term"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
