[package]
name = "icanhaz-app"
version = "0.1.0"
description = "icanhaz — native (tray) consent app; embeds the icanhaz daemon"
edition = "2021"
publish = false

[lib]
# `_lib` suffix keeps the lib name distinct from the bin (a Windows quirk).
name = "icanhaz_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time"] }
# The daemon itself — this app IS the icanhaz backend.
icanhaz-host = { path = "../../host" }
# The shared scope model (the consent window narrows scopes).
ezcap = { path = "../../../../rust/ezcap" }

