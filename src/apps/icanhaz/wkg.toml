# `wkg wit fetch` refreshes wit/deps, which is committed: the wasi:* packages
# from the registry (pinned by wkg.lock), and ezco:ezcap, a workspace-local
# package owned by src/rust/ezcap, which this override copies from that path
# instead of looking for it in a registry. The broker's tests check both the
# copy and the fixtures' vendored copies against their sources.
[overrides]
"ezco:ezcap" = { path = "../../rust/ezcap/wit" }
