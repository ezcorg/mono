# wkg fetches the wasi:* packages from the registry (see wkg.lock and
# wit/deps/README.md). ezco:ezcap is a workspace-local package owned by
# src/rust/ezcap; this override makes `wkg wit fetch` copy it from that
# path into the git-ignored wit/deps/ instead of looking for it in a registry.
[overrides]
"ezco:ezcap" = { path = "../../rust/ezcap/wit" }
