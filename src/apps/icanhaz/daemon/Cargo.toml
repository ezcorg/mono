[package]
name = "icanhazd"
version = "0.1.0"
edition = "2021"
description = "icanhaz daemon — an interactive terminal to this machine over a (Tailscale-fronted) WebSocket."
publish = false

# v0 stack: a PTY bridged over a plain WebSocket (Tailscale Serve adds TLS + the
# tailnet endpoint). v1 swaps the WS transport for wRPC serving the `provider`
# world (see ../wit) — the protocol module here mirrors those WIT contracts.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
