[package]
name = "icanhaz-host"
version = "0.0.0"
edition = "2021"
publish = false
description = "icanhaz policy engine: embeds wasmtime (via wrpc-wasmtime) to run capability policy components and serve their mediated exports over wRPC."

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs", "net", "io-std", "io-util", "process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
tracing = "0.1"
futures = "0.3"

# wasmtime MUST resolve to the exact version `wrpc-wasmtime` uses (pinned to 48
# in the vendored wrpc workspace) — a version/source mismatch across the
# path-dep boundary yields two incompatible `wasmtime` crates and the
# component-model types won't unify.
wasmtime = { version = "48", features = ["async", "component-model", "cranelift", "runtime"] }
wasmtime-wasi = { version = "48", features = ["p2"] }

# Vendored wrpc (submodule at src/rust/wrpc), referenced by path. Its own
# [workspace] governs these crates; the mono workspace excludes that subtree.
wrpc-transport = { path = "../../../../src/rust/wrpc/crates/transport", features = ["net"] }
wrpc-wasmtime = { path = "../../../../src/rust/wrpc/crates/wasmtime" }
# tokio-websockets refuses to build without a SHA1 + RNG backend; wrpc selects
# these at its own root, so depending on wrpc-websockets directly we must too.
wrpc-websockets = { path = "../../../../src/rust/wrpc/crates/websockets", features = ["ring", "rand"] }
wit-bindgen-wrpc = { path = "../../../../src/rust/wrpc/crates/wit-bindgen" }
wrpc-webtransport = { path = "../../../../src/rust/wrpc/crates/webtransport" }
# The peer path: wRPC over iroh QUIC, the remote endpoint id authenticated by
# the handshake and handed to every invocation as its context.
wrpc-transport-iroh = { path = "../../../rust/wrpc-transport-iroh" }
iroh = "1"
wtransport = { version = "0.7.0", features = ["self-signed"] }
portable-pty = "0.8"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
# The consent broker as a library: grant store, certificates, consent, store.
icanhaz-broker = { path = "../broker" }
# The shared capability scope model (ezco:ezcap): per-call admission membranes.
ezcap = { path = "../../../rust/ezcap" }
# The encrypted store's key sources (tests open temp stores).
ezdb = { path = "../../../rust/ezdb" }
# Inference providers over HTTP (OpenAI-compatible, Anthropic).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Component inspection (the Tier 3 validator) and the content-addressed store.
wit-parser = { version = "0.244", features = ["decoding"] }
sha2 = "0.10"
# The `icanhaz` CLI (capability authoring) and composition with wac.
clap = { version = "4.5", features = ["derive", "env"] }
wac-graph = "0.8"
wac-types = "0.8"

[dev-dependencies]
tempfile = "3"
# For the WebTransport roundtrip test's insecure (self-signed) client verifier.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# This crate does not inherit [workspace.lints]: that set denies
# unwrap/expect/panic, which the daemon uses throughout. These two are the
# lints its wRPC/wasmtime bridge trips, allowed for the same reason the
# workspace root gives for type_complexity -- the deep generic types read worse
# as aliases, and the bridge entry points genuinely carry their arguments.
[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
