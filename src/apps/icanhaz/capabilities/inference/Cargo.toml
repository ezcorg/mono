[package]
name = "inference-capability"
version = "0.1.0"
edition = "2024"
publish = false
description = "The shipped `icanhaz:nocap/inference` capability: a thin component over the daemon's raw layer. Resource-shaped: the token once, at open."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.54", features = ["async-spawn"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
