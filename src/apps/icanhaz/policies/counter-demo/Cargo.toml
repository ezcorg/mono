[package]
name = "counter-demo"
version = "0.0.0"
edition = "2021"
publish = false
description = "Tiny resource-exporting component (world counter-host) — proves wRPC resource serving (wrpc-wasmtime ServeExt) end-to-end before the real wasi:filesystem passthrough. Builds to a wasm32-wasip2 component."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"

[profile.release]
opt-level = "s"
lto = true
strip = true
