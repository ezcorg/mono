[package]
name = "icanhaz-broker"
version = "0.0.0"
edition = "2021"
publish = false
description = "icanhaz's consent broker as a library: the grant store (minted instances over ezcap membranes), certificates and sturdy references, consent surfaces, the durable store and declared configuration. The daemon (icanhaz-host) and witmproxy both embed it."

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-std", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
# The broker's wRPC handler + client stubs (`broker.wit`); no transport
# heavier than TCP is linked here.
wrpc-transport = { path = "../../../../src/rust/wrpc/crates/transport", features = ["net"] }
wit-bindgen-wrpc = { path = "../../../../src/rust/wrpc/crates/wit-bindgen" }
# The shared capability scope model (ezco:ezcap): membranes + certificates.
ezcap = { path = "../../../rust/ezcap" }
# The encrypted store (declared configuration + per-owner state).
ezdb = { path = "../../../rust/ezdb" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }

[build-dependencies]
# build.rs generates the ezcap CEL environments from ../wit (see build.rs).
ezcap = { path = "../../../rust/ezcap" }

[dev-dependencies]
tempfile = "3"

# Same stance as icanhaz-host: not the workspace lint set (unwrap/expect are
# used throughout), and the two lints the wRPC bridge trips.
[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
