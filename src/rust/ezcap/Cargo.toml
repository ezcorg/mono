[package]
name = "ezcap"
version = "0.1.0"
edition = "2024"
publish = false
description = "ezco:ezcap — the shared capability scope model: WIT-generated CEL environments, a sentence-rendering profile, and the membrane runtime that mints, narrows and admits capability instances."
license = "MIT"

[dependencies]
anyhow = "1"
cel-cxx = { version = "0.2.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wit-parser = "0.254"
# Certificates: Ed25519-signed link chains over sturdy references.
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = "0.2"

[dev-dependencies]

[lints]
workspace = true
