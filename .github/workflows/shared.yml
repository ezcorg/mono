# @joinezco/shared: checked on every change; published to npm from a `shared-v*` tag or by hand
name: shared

on:
  pull_request:
    paths:
      - src/typescript/shared/**
      - .github/workflows/shared.yml
      - .github/actions/pnpm/**
  push:
    branches: [main]
    tags: ['shared-v*']   # path filters don't apply to tags
    paths:
      - src/typescript/shared/**
      - .github/workflows/shared.yml
      - .github/actions/pnpm/**
  workflow_dispatch:
    inputs:
      version:
        description: version to publish (e.g. 0.0.8)
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm
      - run: pnpm check:shared

  publish:
    if: startsWith(github.ref, 'refs/tags/shared-v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm
      - run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          v="${{ inputs.version }}"; [ -n "$v" ] || v="${GITHUB_REF_NAME#shared-v}"
          src/scripts/publish-shared.sh "$v"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
