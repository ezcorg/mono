name: Test and Build witmproxy

on:
  pull_request:
    paths:
      - 'src/apps/witmproxy/**'
      - 'src/rust/conf-rs/**'
      - 'src/rust/witmproxy-plugin-noop/**'
      - 'src/rust/witmproxy-plugin-adversarial/**'
      - 'clippy.toml'
      - 'deny.toml'
      - 'Cargo.toml'
      - '.github/workflows/witmproxy-test.yml'
      - '.github/workflows/witmproxy-publish.yml'
  push:
    branches:
      - main
    paths:
      - 'src/apps/witmproxy/**'
      - 'src/rust/conf-rs/**'
      - 'src/rust/witmproxy-plugin-noop/**'
      - 'src/rust/witmproxy-plugin-adversarial/**'
      - 'clippy.toml'
      - 'deny.toml'
      - 'Cargo.toml'
      - '.github/workflows/witmproxy-test.yml'
      - '.github/workflows/witmproxy-publish.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test witmproxy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # windows-latest disabled until Windows cel-cxx compilation is fixed

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
          components: rustfmt, clippy
          targets: wasm32-wasip2, wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Check code formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Run clippy lints
        if: runner.os == 'Linux'
        run: cargo clippy --package witmproxy --all-targets -- -D warnings

      - name: Clean cached WASM test artifacts
        run: rm -rf target/wasm32-wasip2

      - name: Install wasmsign2
        run: cargo install wasmsign2-cli

      - name: Build and sign test plugins
        run: |
          make -C src/rust/witmproxy-plugin-noop
          make -C src/rust/wasm-test-component
          make -C src/rust/witmproxy-plugin-noshorts

      # The adversarial fixture is built explicitly rather than on demand so a
      # build failure here is reported as a build failure, not as a confusing
      # test failure inside the suite.
      - name: Build adversarial plugin fixture
        run: cargo build --release --target wasm32-wasip2 -p witmproxy-plugin-adversarial

      - name: Run library tests
        run: cargo test --package witmproxy --lib

      # `otel` is on by default; nothing else exercises the feature being off.
      - name: Check --no-default-features
        if: runner.os == 'Linux'
        run: cargo check --package witmproxy --no-default-features

      - name: Check documentation
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --package witmproxy --no-deps

      - name: Build witmproxy binary
        run: cargo build --package witmproxy --bin witm

      # - name: Run integration tests
      #   run: cargo test --package witmproxy --test '*'

  build-release:
    name: Build release artifacts
    runs-on: ${{ matrix.os }}
    needs: test
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: witm-linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: witm-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: witm-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Build release binary
        run: cargo build --package witmproxy --bin witm --release --target ${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/witm${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: 7