# the witmproxy plugin WIT package on ghcr.io (src/scripts/publish-wit.sh), whenever the world changes.
# Published from main on the trusted Linux pool, with wkg from the workspace dev shell (flake.nix).
name: witmproxy-wit

on:
  push:
    branches: [main]
    paths:
      - src/apps/witmproxy/wit/**
      - src/apps/witmproxy/wkg.toml
      - src/scripts/publish-wit.sh
      - .github/workflows/witmproxy-wit.yml
  workflow_dispatch:
    inputs:
      version:
        description: "version to publish (default: the one in Cargo.toml)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: [nix, linux-vm-trusted]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The script gives wkg the token itself (its registry config), so no docker login is needed.
      - run: nix develop -c src/scripts/publish-wit.sh "${{ inputs.version }}" "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
