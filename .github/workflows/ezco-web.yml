# joinez.co: built on every change, published to GitHub Pages from main
name: ezco-web

on:
  pull_request:
    paths:
      - src/apps/ezco-web/**
      - src/typescript/shared/**
      - .github/workflows/ezco-web.yml
      - .github/actions/pnpm/**
  push:
    branches: [main]
    paths:
      - src/apps/ezco-web/**
      - src/typescript/shared/**
      - .github/workflows/ezco-web.yml
      - .github/actions/pnpm/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/pnpm
      - run: pnpm build:ezco-web
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src/apps/ezco-web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
