[workspace]
resolver = "3"
members = [
    "src/apps/witmproxy",
    "src/apps/witmproxy/e2e",
    "src/apps/eznote/src-tauri",
    "src/rust/wasm-test-component",
    "src/rust/witmproxy-plugin-noop",
    "src/rust/witmproxy-plugin-noshorts",
    "src/rust/witmproxy-plugin-adversarial",
    "src/rust/cicd",
    "src/apps/ezfilter/src-tauri",
    "src/apps/ezfilter/e2e",
    "src/apps/icanhaz/host",
    "src/apps/icanhaz/app/src-tauri",
]
exclude = [
    # Vendored upstream workspace (bytecodealliance/wrpc). It defines its own
    # [workspace]; we depend on its crates by path (wrpc-transport, wrpc-wasmtime,
    # wrpc-websockets, wit-bindgen-wrpc). Excluded so Cargo doesn't try to pull
    # them into the mono workspace.
    "src/rust/wrpc",
    # Policy components are wasm32-wasip2 guests (cdylib); keep them out of the
    # host workspace so a host-target `cargo build` never tries to compile them.
    "src/apps/icanhaz/policies",
    # Vendored upstream workspace (cbeck88/conf-rs). Defines its own [workspace];
    # witmproxy depends on the `conf` crate by path. Excluded so Cargo doesn't
    # pull it (and its conf_derive/conf_extra members) into the mono workspace.
    "src/rust/conf-rs",
]

# Workspace-wide configuration
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
incremental = true

# Optimize dependencies even in dev mode — reduces link time and improves
# runtime performance during development with minimal impact on compile time
# (deps are cached after the first build).
[profile.dev.package."*"]
opt-level = 2
debug = false

# ---------------------------------------------------------------------------
# Workspace lints
#
# Opt a crate in with `[lints] workspace = true` in its Cargo.toml.
#
# Rationale: witmproxy terminates TLS for untrusted traffic and executes
# untrusted WASM plugins. A panic on a per-connection or per-plugin task is not
# a style problem, it is a denial-of-service vector, so the panic-adjacent lints
# below are treated as a security control rather than a preference.
#
# `unwrap_used` / `expect_used` / `panic` start at `warn` while the existing
# call sites are triaged; raise to `deny` once the backlog is clear.
# Test code is exempted via the `allow-*-in-tests` keys in clippy.toml.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unused_imports = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Service/plugin stacks produce deep generic types; renaming them into aliases
# purely to satisfy the lint makes the signatures harder to read, not easier.
type_complexity = "allow"

# Don't panic: a panic in a connection or plugin task takes down live traffic.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
# `unreachable` starts at `warn` alongside unwrap/expect/panic: there are 5
# existing call sites to triage, and a hard failure would block the migration.
unreachable = "warn"
get_unwrap = "deny"
indexing_slicing = "warn"

# Don't fail silently: dropped futures and swallowed errors hide plugin misbehaviour.
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"

# Async footguns. `await_holding_lock` in particular encodes the invariant that
# plugins/registry.rs currently documents in a comment: the plugin-map lock is
# never held across an await.
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"
large_futures = "warn"

# Output discipline: this is a daemon, diagnostics belong in `tracing`.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "deny"

# Memory / unsafe hygiene.
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

# Numeric correctness: cert validity windows and fuel/quota arithmetic.
float_cmp = "warn"
lossy_float_literal = "warn"
invalid_upcast_comparisons = "warn"
cast_possible_truncation = "warn"
